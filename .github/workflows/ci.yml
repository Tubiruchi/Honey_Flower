name: Frontend y Storybook

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar código, tokens y formato
        run: npm run check
      - name: Instalar Chromium
        run: npm exec --workspace @honeyflower/mobile -- playwright install --with-deps chromium
      - name: Probar historias, interacciones y accesibilidad
        run: npm test
      - name: Compilar app
        run: npm run build
      - name: Compilar Storybook
        run: npm run build-storybook
      - uses: actions/upload-artifact@v7
        with:
          name: honeyflower-storybook
          path: apps/mobile/storybook-static
          if-no-files-found: error
          retention-days: 7
